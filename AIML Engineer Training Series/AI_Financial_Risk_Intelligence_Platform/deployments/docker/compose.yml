version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: credit-risk-api
    ports:
      - "8000:8000"
    volumes:
      - ../models:/app/models
    restart: unless-stopped

  dashboard:
    build:
      context: ..
      dockerfile: Dockerfile.streamlit
    container_name: credit-risk-dashboard
    ports:
      - "8501:8501"
    volumes:
      - ../models:/app/models
    restart: unless-stopped